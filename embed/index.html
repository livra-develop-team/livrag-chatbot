<script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>

<script>
  (function() {
    // CSS を注入する関数
    function injectStyles() {
      const css = `
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        font-size:16px;
      }

      .chat-container {
        display: flex;
        flex-direction: column;
        width: 60vw;
        height: 90vh;
        position: fixed;
        bottom: 10px;
        right: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        background-color: #fff;
        border-radius: 1em;
        overflow: hidden;
        z-index: 102;
      }

      @media screen and (max-width: 768px){
        .chat-container {
          width:90%;
        }
      }

      .chat-header {
        padding: 0.25em 1em;
        background: linear-gradient(180deg, rgba(4,56,29,1) 0%, rgba(8,104,54,1) 100%);
        color: #fff;
        font-size: 1.25em;
        font-weight: bold;
        display: flex;
        align-items: center;
        position: relative;
      }

      .chat-header-icon {
        width: 2em;
        height: 2em;
        margin-right: 0.5em;
      }

      .chat-header span {
        display: flex;
        align-items: center;
      }

      .chat-close-button {
        position: absolute;
        top: 0.1em;
        right: 0.5em;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 1.5em;
        cursor: pointer;
      }

      .chat-messages {
        flex: 1;
        padding: 1em;
        overflow-y: auto;
      }

      .message .bubble {
        display: flex;
        align-items: flex-start;
        margin-bottom: 1em;
        text-align: left;
      }

      .message.human {
        text-align: right;
        justify-content: flex-end;
      }

      .message .bubble {
        display: inline-block;
        padding: 0.625em 1.5em;
        border-radius: 1em;
        background-color: #F5F6FA;
        color: #6D6E72;
        max-width: 70%;
      }

      .message.human .bubble {
        background: linear-gradient(180deg, rgba(4,56,29,1) 0%, rgba(8,104,54,1) 100%);
        color: white;
        font-size:1em;
      }

      .message.bot{
        display: flex;
      }

      .message.bot .bubble ol{
        padding-left: 0;
      }

      .message.bot .bubble li {
        list-style-position: inside;
      }

      .message.bot .bubble p {
        margin: 0.5em 0;
        display:inline-block;
      }
        
      .message.bot .bubble li p{
        font-size: 1em;
        display: inline;
      }

      .message.bot a {
        color:blue;
        text-decoration: underline;
      }

      .chat-input {
        display: flex;
        padding: 0.5em 2em;
        border-top: 1px solid #F1F2F8;
        border-bottom: 1px solid #F1F2F8;
        height: auto;
        padding: 1em 2em;
      }

      .chat-input textarea {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1em;
        color: rgb(74, 74, 76);
        resize: none;
        font-family: inherit;
        font-style: normal;
      }

      .chat-input textarea::placeholder {
        color: #B0B6BC;
      }

      #sendButton {
        width: 3.5em;
        height: 3.5em;
        background: linear-gradient(180deg, rgba(4,56,29,1) 0%, rgba(8,104,54,1) 100%);
        border-radius: 50%;
        border: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #sendButton img {
        width: 2.5em;
        height: 2.5em;
        rotate: -45deg;
      }

      .bot-icon {
        width: 2.5em;
        height: 2.5em;
        margin-right: 10px;
        border-radius: 50%;
      }

      .chat-footer {
        padding: 4px;
        font-size: 0.75em;
        text-align: center;
        color: #8E8090;
      }

      #chatbot-toggle_button {
        position: fixed;
        bottom: 10px;
        right: 30px;
        cursor: pointer;
        z-index: 101;
        transition: 0.3s ease;
        width: 6em;
        height: 6em;
        border-radius: 50% 50% 4px 50%;
        background: white;
        box-shadow: 0 0 25px rgba(72, 209, 93, 0.38);
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        opacity: 0.9;
      }

      .chatbot-toggle-link { 
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        padding-left: 0.3em;
      }

      #chatbot-toggle_button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 35px rgba(72, 209, 93, 0.38);
        opacity: 1;
      }

      #chatbot-toggle_button img{
        width: 3em;
        height: 3em;
      }

      .chatbot-toggle-text{
        font-size: 0.8em;
        display: inline-block;
        color: rgb(2, 32, 16);
        font-weight: bold;
      }

      table {
          width: min-content;
          border-collapse: collapse;
          font-size: 1em;
          min-width: 20em;
          max-width: 100%;
          overflow-x: auto;
          display: block;
          border: 2px solid #ddd;
          border-radius: 8px;
      }

      thead {
          background-color: #f7f7f7;
          font-weight: bold;
      }

      thead tr {
          border-bottom: 0.15em solid #ddd;
      }

      tbody tr {
          border-bottom: 0.1em solid #ddd;
      }

      td, th {
          padding: 0.8em;
          text-align: left;
          word-wrap: break-word;
      }

      tbody tr:hover {
          background-color: #f0f0f0;
      }
    `;
      const style = document.createElement('style');
      style.type = 'text/css';
      style.appendChild(document.createTextNode(css));
      document.head.appendChild(style);
    }

    // チャットウィジェットを作成する関数
    function createChatWidget() {
      const container = document.createElement('div');
      container.className = 'chat-container';
      container.style.display = 'none';

      const header = document.createElement('div');
      header.className = 'chat-header';

      // 閉じるボタンの作成
      const closeButton = document.createElement('button');
      closeButton.className = 'chat-close-button';
      closeButton.textContent = '×';
      closeButton.addEventListener('click', function() {
        container.style.display = 'none';
      });
      header.appendChild(closeButton);

      const icon = document.createElement('img');
      icon.src = 'https://livra-develop-team.github.io/livrag-chatbot/icon/sphere_circle_icon.svg';
      icon.alt = 'チャットボットアイコン';
      icon.className = 'chat-header-icon';
      const headerText = document.createElement('span');
      headerText.textContent = 'LiVrA 相談チャットボット';

      // ヘッダーに画像とテキストを追加
      header.appendChild(icon);
      header.appendChild(headerText);
      container.appendChild(header);

      const messages = document.createElement('div');
      messages.className = 'chat-messages';
      messages.id = 'chatMessages';
      container.appendChild(messages);

      const inputArea = document.createElement('div');
      inputArea.className = 'chat-input';

      const inputField = document.createElement('textarea');
      inputField.id = 'chatInput';
      inputField.placeholder = 'Shift+Enterで送信';
      inputArea.appendChild(inputField);

      const sendButton = document.createElement('button');
      sendButton.id = 'sendButton';
      const sendIcon = document.createElement('img');
      sendIcon.src = 'https://livra-develop-team.github.io/livrag-chatbot/icon/send_icon.svg';
      sendIcon.alt = '送信ボタン';
      sendIcon.className = 'send-icon';
      sendButton.appendChild(sendIcon);
      inputArea.appendChild(sendButton);

      container.appendChild(inputArea);

      const footer = document.createElement('div');
      footer.className = 'chat-footer';
      footer.textContent = 'Powered by LiVrA';
      container.appendChild(footer);

      document.body.appendChild(container);
      return container;
    }

    function createToggleButton() {
      const toggleBtn = document.createElement('div');
      toggleBtn.id = 'chatbot-toggle_button';

      const link = document.createElement('a');
      link.href = '#';
      link.className = 'chatbot-toggle-link';
      link.addEventListener('click', function(e) {
        e.preventDefault();
        toggleChatWidget();
      });

      const img = document.createElement('img');
      img.src = 'https://livra-develop-team.github.io/livrag-chatbot/icon/sphere_circle_icon.svg';
      img.alt = 'チャットボット';
      img.className = 'chatbot-toggle-icon';

      const text = document.createElement('span');
      text.textContent = 'Chatで相談';
      text.className = 'chatbot-toggle-text';

      link.appendChild(img);
      link.appendChild(text);
      toggleBtn.appendChild(link);
      document.body.appendChild(toggleBtn);
    }

    function toggleChatWidget() {
      const widget = document.querySelector('.chat-container');
      if (widget.style.display === 'none' || widget.style.display === '') {
        widget.style.display = 'flex';
      } else {
        widget.style.display = 'none';
      }
    }
    let chatHistory = [];

    // マークダウンのリンク形式をHTMLのリンクに変換
    function linkify(text) {
      const urlPattern = /(\bhttps?:\/\/[^\s]+)/gi;
      return text.replace(urlPattern, function(url) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    const markdown = (window.markdownit) ?
      window.markdownit({
        linkify: true,
        breaks: true
      }) :
      null;

    function addMessage(text, isBot) {
      const messages = document.getElementById('chatMessages');
      const messageEl = document.createElement('div');
      messageEl.classList.add('message', isBot ? 'bot' : 'human');

      if (isBot) {
        const icon = document.createElement('img');
        icon.src = 'https://livra-develop-team.github.io/livrag-chatbot/icon/sphere_circle_icon.svg';
        icon.alt = 'Bot Icon';
        icon.className = 'bot-icon';
        messageEl.appendChild(icon);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      bubble.innerHTML = text.replace(/\n/g, '<br>');
      messageEl.appendChild(bubble);

      messages.appendChild(messageEl);
      messages.scrollTop = messages.scrollHeight;
    }

    function setupEventListeners() {
      const sendButton = document.getElementById('sendButton');
      const chatInput = document.getElementById('chatInput');
      sendButton.addEventListener('click', async function() {
        const userInput = chatInput.value.trim();
        if (!userInput) return;
        addMessage(userInput, false);
        chatHistory.push({
          role: 'user',
          content: userInput
        });
        chatInput.value = '';
        let currentBotMessage = null;
        let cumulativeContent = "";

        try {
          const prompt = `
            ## 会話履歴
            ${JSON.stringify(chatHistory, null, 2)}
            ---
            ## 最新の質問
            ${userInput}
            ---
            ユーザーの最新の質問について、必要があれば会話履歴を参照して回答してください。
            会話の流れから、ユーザーに問い合わせフォームを提示するべきだと判断した場合は以下の URL を提供してください。
            また、URL のパラメーター {{お問い合わせ種別}}, {{お問い合わせ内容}} を会話内容から読み取り、適切な文字列に置換してください。
            (お問い合わせ種別: 「お仕事のご依頼」、「サービスについてのお問い合わせ」、「その他」のいずれか)
            https://docs.google.com/forms/d/e/1FAIpQLSeN3dU1e4PPD_YueVqy5ZVaQTxeUB3NP2sl3M_9JuB4X8THIA/viewform?usp=pp_url&entry.1111324941={{お問い合わせ種別}}&entry.1534974223={{お問い合わせ内容}}
        `;
          const response = await fetch('https://livrag.com/api/query_rag', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              question: prompt,
              category: "livra-website",
              project_id: 11,
              user_id: 1,
              is_complicated: false,
            })
          });

          if (!response.ok) {
            console.error("Network response was not ok:", response.statusText);
            addMessage('エラーが発生しました。', true);
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const {
              done,
              value
            } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, {
              stream: true
            });
            const parts = buffer.split("\n\n");
            buffer = parts.pop();

            for (const part of parts) {
              if (!part.startsWith("data: ")) continue;

              const message = part.replace(/^data:\s*/, "").trim();

              if (message === "[DONE]") {
                chatHistory.push({
                  role: 'assistant',
                  content: cumulativeContent
                });
                return;
              }

              try {
                const parsed = JSON.parse(message);
                if (parsed.type === "content") {
                  cumulativeContent += parsed.content;
                  if (!currentBotMessage) {
                    currentBotMessage = document.createElement('div');
                    currentBotMessage.classList.add('message', 'bot');

                    const icon = document.createElement('img');
                    icon.src = 'https://livra-develop-team.github.io/livrag-chatbot/icon/sphere_circle_icon.svg';
                    icon.alt = 'Bot Icon';
                    icon.className = 'bot-icon';
                    currentBotMessage.appendChild(icon);

                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.dataset.raw = parsed.content;
                    if (markdown) {
                      bubble.innerHTML = markdown.render(bubble.dataset.raw);
                    } else {
                      bubble.innerHTML = linkify(bubble.dataset.raw);
                    }
                    currentBotMessage.appendChild(bubble);

                    document.getElementById('chatMessages').appendChild(currentBotMessage);
                  } else {
                    const bubble = currentBotMessage.querySelector('.bubble');
                    bubble.dataset.raw = (bubble.dataset.raw || "") + parsed.content;
                    if (markdown) {
                      bubble.innerHTML = markdown.render(bubble.dataset.raw);
                    } else {
                      bubble.innerHTML = linkify(bubble.dataset.raw);
                    }
                  }
                }
              } catch (err) {
                console.error("Error parsing message:", err);
              }
            }
          }

        } catch (error) {
          console.error('Error:', error);
          addMessage('エラーが発生しました。再試行してください。', true);
        }
      });
      chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          if (e.shiftKey) {
            e.preventDefault();
            sendButton.click();
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      injectStyles();
      createChatWidget();
      createToggleButton();
      setupEventListeners();
    });
  })();
</script>
